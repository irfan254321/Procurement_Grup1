# Fixture taken exactly from the report (Bab 6). Money is integer rupiah.
request:
  quantity: 1000
  urgent_quantity: 700        # the other 300 units can wait until next month
  budget: 100000000
  deadline_days: 10

cash:
  initial: 150000000
  other_needs: [70000000, 0, 0, 0]   # month 1 = 40 jt + 30 jt (6.5), months 2-4 = 0
